<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>78张全牌阵数字塔罗体验</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    /* 1. 封面视图样式 */
    #cover-view {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: url('cover.png') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.6s ease, visibility 0.6s;
    }

    /* 封面隐藏时的状态 */
    #cover-view.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Start 按钮样式 */
    .start-btn {
      margin-top: 200px; /* 控制按钮在图片中的上下位置 */
      padding: 14px 50px;
      font-size: 24px;
      font-weight: bold;
      color: #d35400;
      background-color: #fce868;
      border: 4px solid #ffffff;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.2s, background-color 0.2s;
    }

    .start-btn:hover {
      transform: scale(1.08);
      background-color: #fff07c;
    }

    /* 2. 主塔罗应用视图样式（使用 background.png 作为底图） */
    #app-view {
      min-height: 100vh;
      background: url('background.png') center/cover repeat-y fixed;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #333333; /* 文字颜色可根据底图深浅调整 */
    }

    .container {
      max-width: 950px;
      width: 100%;
      text-align: center;
      background: rgba(255, 255, 255, 0.85); /* 半透明白色底，让文字更清晰 */
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(10px);
      margin-top: 10px;
    }

    h1 {
      color: #b9770e;
      margin-bottom: 5px;
      font-size: 1.8rem;
    }

    /* 其它原有样式可以在此补充 */
  </style>
</head>
<body>

  <!-- 第一页：封面视图 -->
  <div id="cover-view">
    <button class="start-btn" onclick="startApp()">Start</button>
  </div>

  <!-- 第二页：塔罗牌主应用视图 -->
  <div id="app-view">
    <div class="container">
      <h1>塔罗牌在线占卜</h1>
      <p class="subtitle">在下方输入你的问题，抽取你的专属指引</p>
      
      <!-- 你的输入框和抽牌区域 -->
      <div style="margin: 20px 0;">
        <input type="text" id="questionInput" placeholder="请输入你的问题..." style="padding: 10px; width: 60%; border-radius: 8px; border: 1px solid #ccc;">
      </div>
      
      <div id="cardDeck">
        <!-- 塔罗牌卡片会显示在这里 -->
      </div>
      
      <div id="resultText" style="margin-top: 20px; font-weight: bold;"></div>
    </div>
  </div>

  <script>
    // 点击 Start 按钮触发的函数：隐藏封面
    function startApp() {
      const cover = document.getElementById('cover-view');
      cover.classList.add('hidden');
    }
  </script>
</body>
</html>
