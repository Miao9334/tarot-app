<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>How is your day? - Tarot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    /* 1. 封面视图 */
    #cover-view {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: url('cover.png') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 18vh;
      z-index: 1000;
      transition: opacity 0.6s ease, visibility 0.6s;
    }

    #cover-view.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-btn {
      padding: 14px 60px;
      font-size: 26px;
      font-weight: bold;
      color: #d35400;
      background-color: #fce868;
      border: 4px solid #ffffff;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.2s, background-color 0.2s;
    }

    .start-btn:hover {
      transform: scale(1.08);
      background-color: #fff07c;
    }

    /* 2. 主界面视图 */
    #app-view {
      min-height: 100vh;
      background: url('background.png') center/cover repeat-y fixed;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 提示文字区域 */
    .tip-box {
      margin-top: 30px;
      margin-bottom: 30px;
      text-align: center;
    }

    .tip-box h2 {
      font-size: 22px;
      color: #b9770e;
      background: rgba(255, 255, 255, 0.85);
      padding: 12px 28px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      backdrop-filter: blur(5px);
    }

    /* 78张牌扇形展开容器 */
    .fan-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 280px;
      margin: 20px auto;
      display: flex;
      justify-content: center;
    }

    /* 卡片基础属性 */
    .tarot-card {
      position: absolute;
      width: 80px;
      height: 140px;
      bottom: 20px;
      transform-origin: 50% 180%;
      cursor: pointer;
      perspective: 1000px;
      transition: transform 0.4s ease, top 0.4s ease, opacity 0.4s ease;
    }

    .tarot-card:hover {
      z-index: 999 !important;
    }

    /* 3D 翻牌结构 */
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }

    .tarot-card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 6px;
      border: 2px solid #ffffff;
    }

    /* 卡牌背面 */
    .card-back {
      background: linear-gradient(135deg, #2c3e50, #4ca1af);
      color: #f1c40f;
      font-size: 20px;
    }

    /* 卡牌正面 */
    .card-front {
      background: #fffdf9;
      color: #2c3e50;
      transform: rotateY(180deg);
    }

    .card-symbol {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .card-name {
      font-size: 11px;
      font-weight: bold;
      color: #d35400;
    }

    /* 结果解读框 */
    .result-box {
      margin-top: 30px;
      max-width: 600px;
      width: 90%;
      background: rgba(255, 255, 255, 0.9);
      padding: 20px 25px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      backdrop-filter: blur(8px);
      text-align: center;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .result-title {
      font-size: 18px;
      font-weight: bold;
      color: #b9770e;
      margin-bottom: 8px;
    }

    .result-desc {
      font-size: 15px;
      color: #333;
      line-height: 1.6;
    }

    /* 黄色返回键样式 */
    .reset-btn {
      display: none;
      margin-top: 20px;
      padding: 10px 30px;
      font-size: 16px;
      font-weight: bold;
      color: #d35400;
      background-color: #fce868;
      border: 3px solid #ffffff;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.2s, background-color 0.2s;
    }

    .reset-btn:hover {
      transform: scale(1.05);
      background-color: #fff07c;
    }
  </style>
</head>
<body>

  <!-- 第一页：封面 -->

      <div id="resultText" class="result-desc">请在上方扇形牌阵中凭直觉点击抽取一张塔罗牌。</div>
    </div>

    <!-- 黄色返回/重置键 -->
    <button id="resetBtn" class="reset-btn" onclick="resetApp()">返回封面 · 重新占卜</button>
  </div>

      // --- 宝剑组 (Swords / The Winter) ---
      { name: "宝剑首牌 (Ace of Swords)", symbol: "⚔️", meaning: "【故事】冬天用剪刀修剪花园植物，确保来年春天生长得更好[cite: 102]。\n【牌意】挑战，危机，伤害，问题[cite: 102]。" },
      { name: "宝剑二 (Two of Swords)", symbol: "⚔️", meaning: "【牌意】选择，逃避，思考，矛盾，内心混乱[cite: 103]。" },
      { name: "宝剑三 (Three of Swords)", symbol: "⚔️", meaning: "【牌意】修剪亦是痛苦，也是成长。修剪，整理，成长，伤害[cite: 104]。" },
      { name: "宝剑四 (Four of Swords)", symbol: "⚔️", meaning: "【牌意】疗养，回避, 停止, 休息, 身心俱疲, 休战[cite: 105]。" },
      { name: "宝剑五 (Five of Swords)", symbol: "⚔️", meaning: "【牌意】外面的寒风吹进花房，混乱，小团体，矛盾冲突[cite: 106]。" },
      { name: "宝剑六 (Six of Swords)", symbol: "⚔️", meaning: "【牌意】离开舒适圈，挑战，前途未知[cite: 107]。" },
      { name: "宝剑七 (Seven of Swords)", symbol: "⚔️", meaning: "【牌意】飞蛾扑火，只为那一瞬的温暖。幻想，迷茫，内心混乱[cite: 108]。" },
      { name: "宝剑八 (Eight of Swords)", symbol: "⚔️", meaning: "【牌意】只是一个将自己内心困住的牢笼。保护，牢笼，向往自由，被束缚，圈养[cite: 109]。" },
      { name: "宝剑九 (Nine of Swords)", symbol: "⚔️", meaning: "【牌意】梦中的飞蛾在黑暗中迷失，被蜘蛛网粘住。危机四伏，恐慌害怕，被禁锢[cite: 110]。" },
      { name: "宝剑十 (Ten of Swords)", symbol: "⚔️", meaning: "【牌意】痛苦，结束，死亡，悲伤，孤独，精神压力太大[cite: 111]。" },
      { name: "宝剑侍从 (Page of Swords)", symbol: "⚔️", meaning: "【牌意】机遇与挑战，敏锐，谨慎，观察事物变化[cite: 112]。" },
      { name: "宝剑骑士 (Knight of Swords)", symbol: "⚔️", meaning: "【牌意】行动力快，迅速，勇往直前，做好准备面对挑战，马上将会有答案[cite: 113]。" },
      { name: "宝剑女王 (Queen of Swords)", symbol: "⚔️", meaning: "【牌意】理性，冷静，独立，果断，足智多谋，原则性强[cite: 114]。" },
      { name: "宝剑国王 (King of Swords)", symbol: "⚔️", meaning: "【牌意】权威，公正，目标明确，洞察全局，理性克制[cite: 115]。" }
    ];

    let hasSelected = false;

    function startApp() {
      document.getElementById('cover-view').classList.add('hidden');
    }

    function initDeck() {
      const container = document.getElementById('fanContainer');
      container.innerHTML = '';
      hasSelected = false;
      document.getElementById('resetBtn').style.display = 'none';

      const totalCards = 78;
      const startAngle = -60;
      const endAngle = 60;
      const angleStep = (endAngle - startAngle) / (totalCards - 1);

      for (let i = 0; i < totalCards; i++) {
        const card = document.createElement('div');
        card.className = 'tarot-card';
        card.dataset.index = i;

        const angle = startAngle + (i * angleStep);
        card.style.transform = `rotate(${angle}deg)`;
        card.style.zIndex = i;

        card.innerHTML = `
          <div class="card-inner">
            <div class="card-back">✦</div>
            <div class="card-front">
              <div class="card-symbol" id="symbol-${i}">✨</div>
              <div class="card-name" id="name-${i}">塔罗牌</div>
            </div>
          </div>
        `;

        card.onclick = () => selectCard(card, i);
        container.appendChild(card);
      }
    }

    function selectCard(selectedCard, index) {
      if (hasSelected) return;
      hasSelected = true;

      const randomCard = tarotDatabase[Math.floor(Math.random() * tarotDatabase.length)];

      document.getElementById(`symbol-${index}`).innerText = randomCard.symbol;
      document.getElementById(`name-${index}`).innerText = randomCard.name;

      const allCards = document.querySelectorAll('.tarot-card');
      allCards.forEach((card) => {
        if (card === selectedCard) {
          card.classList.add('flipped');
          card.style.transform = `translateY(-30px) scale(1.1)`;
          card.style.zIndex = 1000;
        } else {
          card.style.opacity = "0.2";
          card.style.pointerEvents = "none";
        }
      });

      const resultBox = document.getElementById("resultBox");
      resultBox.innerHTML = `
        <div class="result-title">🌟 你的今日运势指引 🌟</div>
        <div class="result-desc">
          抽中的牌是 <b>${randomCard.name}</b><br><br>
          ${randomCard.meaning.replace(/\n/g, '<br>')}
        </div>
      `;

      document.getElementById('resetBtn').style.display = 'block';
    }

    function resetApp() {
      document.getElementById('cover-view').classList.remove('hidden');
      document.getElementById("resultBox").innerHTML = `
        <div id="resultText" class="result-desc">请在上方扇形牌阵中凭直觉点击抽取一张塔罗牌。</div>
      `;
      initDeck();
    }

    window.onload = initDeck;
  </script>
</body>
